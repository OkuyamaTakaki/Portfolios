<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 549 661" role="img" aria-labelledby="title description">
  <title id="title">レトロルーレット画面</title>
  <desc id="description">1から16までの数字と開始、停止、リセット操作を示した幾何学図形のみの作品紹介画像</desc>
  <rect width="549" height="661" rx="18" fill="#101213"/>
  <rect x="12" y="12" width="525" height="637" rx="12" fill="#1a1d1e" stroke="#f5f1e6" stroke-width="3"/>
  <g fill="#ffd052">
    <circle cx="30" cy="31" r="6"/>
    <circle cx="519" cy="31" r="6"/>
    <circle cx="30" cy="630" r="6"/>
    <circle cx="519" cy="630" r="6"/>
  </g>
  <text x="274.5" y="70" fill="#f5f1e6" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">ROULETTE</text>
  <text x="274.5" y="96" fill="#aab4af" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">1 — 16</text>
  <g font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">
    <g fill="#252a2b" stroke="#58615d" stroke-width="2">
      <rect x="33" y="121" width="113" height="86"/><rect x="156" y="121" width="113" height="86"/><rect x="279" y="121" width="113" height="86"/><rect x="402" y="121" width="113" height="86"/>
      <rect x="33" y="217" width="113" height="86"/><rect x="156" y="217" width="113" height="86"/><rect x="279" y="217" width="113" height="86"/><rect x="402" y="217" width="113" height="86"/>
      <rect x="33" y="313" width="113" height="86"/><rect x="156" y="313" width="113" height="86"/><rect x="279" y="313" width="113" height="86"/><rect x="402" y="313" width="113" height="86"/>
      <rect x="33" y="409" width="113" height="86"/><rect x="156" y="409" width="113" height="86"/><rect x="279" y="409" width="113" height="86"/><rect x="402" y="409" width="113" height="86"/>
    </g>
    <g fill="#f5f1e6">
      <text x="89.5" y="173">1</text><text x="212.5" y="173">2</text><text x="335.5" y="173">3</text><text x="458.5" y="173">4</text>
      <text x="89.5" y="269">5</text><text x="212.5" y="269">6</text><text x="335.5" y="269">7</text><text x="458.5" y="269">8</text>
      <text x="89.5" y="365">9</text><text x="212.5" y="365">10</text><text x="335.5" y="365">11</text><text x="458.5" y="365">12</text>
      <text x="89.5" y="461">13</text><text x="212.5" y="461">14</text><text x="335.5" y="461">15</text><text x="458.5" y="461">16</text>
    </g>
  </g>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <rect x="33" y="536" width="151" height="66" rx="7" fill="#ffd052"/>
    <text x="108.5" y="577" fill="#101213">START</text>
    <rect x="199" y="536" width="151" height="66" rx="7" fill="#2d3332" stroke="#7e8984" stroke-width="2"/>
    <text x="274.5" y="577" fill="#f5f1e6">STOP</text>
    <rect x="365" y="536" width="151" height="66" rx="7" fill="#2d3332" stroke="#7e8984" stroke-width="2"/>
    <text x="440.5" y="577" fill="#f5f1e6">RESET</text>
  </g>
  <text x="274.5" y="628" fill="#aab4af" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">JAVASCRIPT MINI GAME</text>
</svg>
